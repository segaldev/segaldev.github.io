name: Refresh Firebase sign-in helper

on:
  push:
    branches: [main]
    paths: [".github/workflows/auth-helper.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the helper files from Firebase
        run: |
          set -euo pipefail
          P=https://hourbox-63cd5.firebaseapp.com
          mkdir -p __/auth __/firebase
          # GitHub Pages serves /__/auth/handler from handler.html
          curl -fsSL "$P/__/auth/handler"        -o __/auth/handler.html
          curl -fsSL "$P/__/auth/handler.js"     -o __/auth/handler.js
          curl -fsSL "$P/__/auth/experiments.js" -o __/auth/experiments.js
          curl -fsSL "$P/__/auth/iframe"         -o __/auth/iframe.html
          curl -fsSL "$P/__/auth/iframe.js"      -o __/auth/iframe.js
          curl -fsSL "$P/__/firebase/init.json"  -o __/firebase/init.json
          ls -la __/auth __/firebase
      - name: Commit any changes
        run: |
          git config user.name "hourbox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update Firebase sign-in helper" && git push; fi
