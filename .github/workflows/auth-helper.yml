name: Refresh Firebase sign-in helper

on:
  push:
    branches: [main]
    paths: [".github/workflows/auth-helper.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the helper files from Firebase
        run: |
          set -euo pipefail
          P=https://hourbox-63cd5.firebaseapp.com
          mkdir -p __/auth __/firebase
          get() { # get <url path> <file> <required|optional>
            code=$(curl -sSL -o "$2" -w "%{http_code}" "$P$1")
            echo "$code $1"
            if [ "$code" != "200" ]; then rm -f "$2"; [ "$3" = required ] && exit 1; fi
            return 0
          }
          # GitHub Pages serves /__/auth/handler from handler.html
          get /__/auth/handler        __/auth/handler.html    required
          get /__/auth/handler.js     __/auth/handler.js      required
          get /__/auth/iframe         __/auth/iframe.html     required
          get /__/auth/iframe.js      __/auth/iframe.js       required
          get /__/auth/experiments.js __/auth/experiments.js  optional
          get /__/firebase/init.json  __/firebase/init.json   optional
          ls -la __/auth __/firebase
          grep -o 'src="[^"]*"' __/auth/handler.html __/auth/iframe.html || true
      - name: Commit any changes
        run: |
          git config user.name "hourbox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update Firebase sign-in helper" && git push; fi
